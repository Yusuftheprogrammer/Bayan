<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen">
  <main class="max-w-4xl mx-auto p-4">
    <h1 class="text-4xl font-bold">Bayan</h1>
    <p class="text-stone-500 mb-4">A programming language in Arabic</p>

    <button id="go" class="bg-teal-700 hover:bg-teal-800 text-white font-semibold px-5 py-2 rounded-lg mb-4">
      Run ▶
    </button>

    <div class="grid md:grid-cols-2 gap-4">
      <textarea id="code" dir="rtl" spellcheck="false"
        class="w-full h-80 p-3 font-mono text-right bg-white border border-stone-300 rounded-lg"></textarea>
      <pre id="out"
        class="h-80 p-3 overflow-auto font-mono whitespace-pre-wrap bg-white border border-stone-300 rounded-lg [unicode-bidi:plaintext]"></pre>
    </div>
  </main>

  <script type="module">
    import { run } from "./bayan.js";
    go.onclick = () => (out.textContent = run(code.value));
  </script>
</body>
</html>
